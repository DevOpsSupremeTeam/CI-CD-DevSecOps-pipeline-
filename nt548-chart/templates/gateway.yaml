apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: {{- .Values.gateway.image.repository }}:{{- .Values.gateway.image.tag }}
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: nt548
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
      nodePort: 30080
