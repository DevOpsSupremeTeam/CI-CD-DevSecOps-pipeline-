apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: customer-rollout
  labels:
    app: customer
spec:
  replicas: {{ .Values.customer.replicaCount }}
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: nt548-canary-analysis
          args:
          - name: app
            value: customer
          - name: canary-hash
            valueFrom:
              podTemplateHash: Latest
      - setWeight: 50
      - pause: {duration: 30s}
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
      - name: customer
        image: "{{- .Values.customer.image.repository }}: {{- .Values.customer.image.tag }}"
        resources:
          requests:
            cpu: "100m"       
            memory: "192Mi"   
          limits:
            cpu: "500m"   
            memory: "512Mi"
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: nt548-configmap
              key: CUSTOMER_PORT
        envFrom:
        - configMapRef:
            name: nt548-configmap-general
        - secretRef:
            name: nt548-secret-general
        startupProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 3
          failureThreshold: 40  
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8001
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001