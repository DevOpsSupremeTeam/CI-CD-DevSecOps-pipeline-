apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-deployment
  labels:
    app: customer
spec:
  replicas: {{ .Values.customer.replicaCount }}
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
      - name: customer
        image: "{{- .Values.customer.image.repository }}: {{- .Values.customer.image.tag }}"
        resources:
          requests:
            cpu: "250m"       # 0.02 Core - Chỉ đủ để duy trì nhịp thở
            memory: "512Mi"   # Rất ít, đủ để Node.js khởi động
          limits:
            cpu: "500m"      # Giới hạn cực thấp để tránh treo cả máy ảo Azure
            memory: "1024Mi"
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: nt548-configmap
              key: CUSTOMER_PORT
        envFrom:
        - configMapRef:
            name: nt548-configmap-general
        - secretRef:
            name: nt548-secret-general
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  selector:
    app: customer
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001