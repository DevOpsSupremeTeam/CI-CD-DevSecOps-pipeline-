apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-backup-pvc
  namespace: nt548
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
  namespace: nt548
spec:
  schedule: "0 18 * * *"       
  concurrencyPolicy: Forbid   
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: mongodump
            image: mongo:latest
            envFrom:
            - secretRef:
                name: nt548-secret  
            command:
            - /bin/sh
            - -c
            - |
              set -e
              TS=$(date +%F-%H%M%S)
              mongodump \
                --host mongo-service:27017 \
                --username "$MONGO_INITDB_ROOT_USERNAME" \
                --password "$MONGO_INITDB_ROOT_PASSWORD" \
                --authenticationDatabase admin \
                --archive="/backup/mongo-$TS.archive.gz" --gzip
              find /backup -name 'mongo-*.archive.gz' -mtime +7 -print -delete
              ls -lh /backup
            volumeMounts:
            - name: backup
              mountPath: /backup
          volumes:
          - name: backup
            persistentVolumeClaim:
              claimName: mongodb-backup-pvc
