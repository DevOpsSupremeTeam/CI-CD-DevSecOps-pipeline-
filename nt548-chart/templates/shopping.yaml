apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: shopping-rollout
  labels:
    app: shopping
spec:
  replicas: {{ .Values.shopping.replicaCount }}
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: nt548-canary-analysis
          args:
          - name: app
            value: shopping
          - name: canary-hash
            valueFrom:
              podTemplateHash: Latest
      - setWeight: 50
      - pause: {duration: 30s}
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8003"
    spec:
      containers:
      - name: shopping
        image: "{{- .Values.shopping.image.repository }}: {{- .Values.shopping.image.tag }}"
        resources:
          requests:
            cpu: "100m"
            memory: "192Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8003
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: nt548-configmap
              key: SHOPPING_PORT
        envFrom:
        - configMapRef:
            name: nt548-configmap-general
        - secretRef:
            name: nt548-secret-general
        startupProbe:
          httpGet:
            path: /health
            port: 8003
          periodSeconds: 3
          failureThreshold: 40
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8003
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-service
spec:
  selector:
    app: shopping
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
