apiVersion: apps/v1
kind: Deployment
metadata:
  name: products-deployment
  labels:
    app: products
spec:
  replicas: {{ .Values.products.replicaCount }}
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
    spec:
      containers:
      - name: products
        image: "{{- .Values.products.image.repository }}: {{- .Values.products.image.tag }}"
        resources:
          requests:     
            cpu: "250m"
            memory: "512Mi"
          limits:    
            cpu: "500m"
            memory: "1024Mi"
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: nt548-configmap
              key: PRODUCTS_PORT
        envFrom:
        - configMapRef:
            name: nt548-configmap-general
        - secretRef:
            name: nt548-secret-general
        startupProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 3
          failureThreshold: 40          
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  selector:
    app: products
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002