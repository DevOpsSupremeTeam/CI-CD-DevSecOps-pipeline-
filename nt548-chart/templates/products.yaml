apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: products-rollout
  labels:
    app: products
spec:
  replicas: {{ .Values.products.replicaCount }}
  strategy:
    canary:
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: nt548-canary-analysis
          args:
          - name: app
            value: products
          - name: canary-hash
            valueFrom:
              podTemplateHash: Latest
      - setWeight: 50
      - pause: {duration: 30s}
  selector:
    matchLabels:
      app: products
  template:
    metadata:
      labels:
        app: products
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
      - name: products
        image: "{{- .Values.products.image.repository }}: {{- .Values.products.image.tag }}"
        resources:
          requests:     
            cpu: "100m"
            memory: "192Mi"
          limits:    
            cpu: "500m"
            memory: "512Mi"
        ports:
        - containerPort: 8002
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: nt548-configmap
              key: PRODUCTS_PORT
        envFrom:
        - configMapRef:
            name: nt548-configmap-general
        - secretRef:
            name: nt548-secret-general
        startupProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 3
          failureThreshold: 40          
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: products-service
spec:
  selector:
    app: products
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8002