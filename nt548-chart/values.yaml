shopping:
  replicaCount: 2
  image:
    repository: catarena/shopping
    tag: "v3"
customer:
  replicaCount: 2
  image:
    repository: catarena/customer
    tag: "v3"
products:
  replicaCount: 2
  image:
    repository: catarena/products
    tag: "v3"

# Cấu hình Ingress
ingress:
  enabled: true
  className: "nginx"
  
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/server-alias: "www.cookial.site"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

  tls:
    - secretName: cookial-tls-prod
      hosts:
        - cookial.site
        - www.cookial.site
  hosts:
    - host: cookial.site
      paths:
         - path: /customer(/|$)(.*)
           serviceName: customer-service 
           pathType: ImplementationSpecific
           port: 80
         - path: /shopping(/|$)(.*)
           serviceName: shopping-service
           pathType: ImplementationSpecific
           port: 80
         - path: /()(.*)
           serviceName: products-service
           pathType: ImplementationSpecific
           port: 80

service:
  port: 80

# Prometheus bản nhẹ để AnalysisTemplate của canary query
prometheus:
  enabled: true
  image: prom/prometheus:v2.54.1

# Ngưỡng phân tích canary (dùng chung cả 3 service)
rollout:
  analysis:
    # tỉ lệ request 5xx tối đa của pod canary (0.05 = 5%)
    maxErrorRate: "0.05"
    # p95 latency tối đa của pod canary (giây)
    maxP95Seconds: "0.8"
    # cửa sổ tính rate
    window: 1m
