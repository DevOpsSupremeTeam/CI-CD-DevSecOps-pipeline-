shopping:
  replicaCount: 2
  image:
    repository: catarena/shopping
    tag: 12
customer:
  replicaCount: 2
  image:
    repository: catarena/customer
    tag: 11
products:
  replicaCount: 2
  image:
    repository: catarena/products
    tag: 14

# Cấu hình Ingress
ingress:
  enabled: true
  className: "nginx"
  
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2

  hosts:
    - host: nt548.com
      paths:
         - path: /customer(/|$)(.*)
           serviceName: customer-service 
           pathType: ImplementationSpecific
           port: 80
         - path: /shopping(/|$)(.*)
           serviceName: shopping-service
           pathType: ImplementationSpecific
           port: 80
         - path: /products(/|$)(.*)
           serviceName: products-service
           pathType: ImplementationSpecific
           port: 80

service:
  port: 80
