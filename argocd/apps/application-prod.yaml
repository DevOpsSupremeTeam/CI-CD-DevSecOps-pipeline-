# App con: deploy nt548-chart lên môi trường PRODUCTION.
# Sync MANUAL -> workload chỉ deploy khi bạn bấm Sync (an toàn cho prod).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nt548-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOpsSupremeTeam/CI-CD-DevSecOps-pipeline-.git
    targetRevision: main
    path: nt548-chart
    helm:
      valueFiles:
        - values-prod.yaml      # tương đối so với path nt548-chart/
  destination:
    server: https://kubernetes.default.svc
    namespace: nt548-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true    # tự tạo namespace nt548-prod khi sync
